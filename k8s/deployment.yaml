apiVersion: apps/v1
kind: Deployment
metadata:
  name: cs454-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cs454-web
  template:
    metadata:
      labels:
        app: cs454-web
    spec:
      containers:
        - name: web
          image: cs454-midterm:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: SERVICE_NAME
              value: "kubernetes-web"
            - name: MESSAGE
              value: "Hello from Kubernetes"
